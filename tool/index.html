<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--panel:#fff;--soft:#f1f0ec;--line:#e4e2db;--text:#2b2f33;--dim:#7a7f84;--gold:#3f7f78;--onacc:#fff;--green:#3d8a5a;--red:#b8574d;--blue:#3f6fa8;--chip:#efeee9;--notebg:#eef4f2;--notefg:#40575a;--warnbg:#f8ecea;--warnfg:#7a4540;--tagsbg:#f6dcd8;--tagsfg:#8a3f37;--tagnbg:#dcefe3;--tagnfg:#2f6b47;--tagibg:#eee9d4;--tagifg:#6d6128;--shadow:0 1px 2px rgba(40,40,30,.05);--demobg:#f3e6c9;--demofg:#6d5420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--panel:#1c2023;--soft:#171a1c;--line:#2c3236;--text:#e2e4e1;--dim:#8d9498;--gold:#6fb5ab;--onacc:#0f1a19;--green:#6fc38e;--red:#e08b81;--blue:#82aee0;--chip:#252a2d;--notebg:#1b2625;--notefg:#a9c3c0;--warnbg:#2a1d1c;--warnfg:#e3b4ae;--tagsbg:#3a2321;--tagsfg:#f0a79f;--tagnbg:#1f3328;--tagnfg:#8fd5a9;--tagibg:#302d1d;--tagifg:#d9c88a;--shadow:none;--demobg:#33290f;--demofg:#e8c77a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181a;--panel:#1c2023;--soft:#171a1c;--line:#2c3236;--text:#e2e4e1;--dim:#8d9498;--gold:#6fb5ab;--onacc:#0f1a19;--green:#6fc38e;--red:#e08b81;--blue:#82aee0;--chip:#252a2d;--notebg:#1b2625;--notefg:#a9c3c0;--warnbg:#2a1d1c;--warnfg:#e3b4ae;--tagsbg:#3a2321;--tagsfg:#f0a79f;--tagnbg:#1f3328;--tagnfg:#8fd5a9;--tagibg:#302d1d;--tagifg:#d9c88a;--shadow:none;--demobg:#33290f;--demofg:#e8c77a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'DM Sans',system-ui,sans-serif;margin:0;font-weight:600;text-wrap:balance}
.mono{font-family:'DM Mono',monospace}
header{padding:28px 20px 0;max-width:1180px;margin:0 auto}
header h1{font-size:24px;letter-spacing:-.01em}
header p{margin:4px 0 16px;color:var(--dim);font-size:14px;max-width:62ch}
nav{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--dim);padding:10px 14px;cursor:pointer;font:500 14px 'DM Sans',system-ui,sans-serif;border-bottom:2px solid transparent;margin-bottom:-1px}
nav button:hover{color:var(--text)}
nav button.on{color:var(--gold);border-color:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:24px 20px 96px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
.panel h2{font-size:18px;margin-bottom:6px}
.panel h3{font-size:15px;color:var(--text)}
.sub{color:var(--dim);font-size:14px;margin:0 0 14px;max-width:70ch}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 5px}
input,select,textarea{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:14px 'DM Mono',monospace;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--gold) 40%,transparent);border-color:var(--gold)}
textarea{min-height:60px}
input[type=radio],input[type=checkbox]{width:auto;accent-color:var(--gold)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:150px}
button.b{white-space:nowrap;background:var(--gold);color:var(--onacc);border:0;border-radius:8px;padding:10px 18px;font:500 14px 'DM Sans',system-ui,sans-serif;cursor:pointer}
button.b:hover{filter:brightness(1.06)}
button.b.alt{background:var(--soft);color:var(--text);border:1px solid var(--line)}
button.b:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:16px;padding:4px 12px;font:13px 'DM Sans'}
.chip b{color:var(--text);font-weight:500}
.ac{display:inline-block;margin:2px 4px 2px 0;padding:3px 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:13px 'DM Sans',system-ui,sans-serif;cursor:pointer;user-select:none}
.ac:hover{border-color:var(--gold);color:var(--text)}
.ac.o{border-color:var(--blue);color:var(--blue);background:transparent}
.ac.c{background:var(--gold);border-color:var(--gold);color:var(--onacc);font-weight:500}
.ac.dsh{border-style:dashed}
.acx{width:90px;padding:3px 8px;font:13px 'DM Mono',ui-monospace,monospace}
.chip button{background:none;border:0;color:var(--dim);cursor:pointer;margin-left:4px}
.radios label{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--text);margin:4px 14px 4px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--dim);font:500 12px 'DM Sans',system-ui,sans-serif;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);font-family:'DM Mono',monospace;font-size:13px;vertical-align:middle}
tr.r:hover{background:var(--soft);cursor:pointer}
.tag{padding:2px 9px;border-radius:10px;font:12px 'DM Sans',system-ui,sans-serif;white-space:nowrap}
.tag.s{background:var(--tagsbg);color:var(--tagsfg)}.tag.n{background:var(--tagnbg);color:var(--tagnfg)}.tag.i{background:var(--tagibg);color:var(--tagifg)}
.note{border-radius:10px;padding:11px 14px;background:var(--notebg);font-size:14px;color:var(--notefg);margin:12px 0}
.note b{color:var(--text)}
.warn{background:var(--warnbg);color:var(--warnfg)}
details.more{margin:12px 0}
details.more>summary{cursor:pointer;color:var(--gold);font-size:14px;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"– "}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--soft);border-radius:10px;padding:14px}.kpi b{display:block;font:500 22px 'DM Mono',ui-monospace,monospace}.kpi span{font-size:13px;color:var(--dim)}
.demo{background:var(--demobg);color:var(--demofg);padding:8px 14px;font-size:14px;text-align:center}
.hide{display:none}
.method h3{margin:24px 0 6px;font-size:17px}.method p,.method li{color:var(--text);line-height:1.65;max-width:72ch}
code{font-family:'DM Mono',monospace;background:var(--chip);padding:1px 6px;border-radius:5px;font-size:13px}
.formula{font:14px 'DM Mono',ui-monospace,monospace;background:var(--soft);padding:12px 16px;border-radius:10px;margin:10px 0;overflow-x:auto}
svg text{fill:var(--dim);font:10px 'DM Mono',ui-monospace,monospace}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:var(--panel);color:var(--text);border-radius:14px;padding:22px;max-width:420px;width:100%}
.mbox p{margin:0 0 16px}.mrow{display:flex;gap:10px;justify-content:flex-end}
@media (max-width:600px){main{padding:16px 16px 80px}header{padding:20px 16px 0}.panel{padding:16px}}
</style>
</head>

<script>
/* ============================================================ constants + helpers */
window.addEventListener('error',e=>{const b=document.getElementById('errBanner');if(b){b.textContent='Error: '+(e.message||'unknown')+(e.lineno?' (line '+e.lineno+')':'')+(window.ADMI_AIRPORTS?'':' | airports data did not load');b.classList.remove('hide')}});
const DEFAULTS={rate:0.15,cs1:1.0,cs2:0.66,cs3:0.33,cs4:0.1,wp:0.5,wc:0.3,wr:0.2,ref:500,floor:100,thr:0.6,share:0.8,minDates:5,std:0,stdMin:5,tax:1,taxPct:7.5,taxFlat:15.40,smooth:1,minFpb:75,ver:5};
const migrateParams=p=>{const old=(p&&p.ver)||1;p={...DEFAULTS,...(p||{})};if(old<2)p.minDates=5;if(old<4)p.smooth=1;p.ver=5;return p}
// Taxes are removed by the rules of the country the flight leaves from. US: 7.5% excise + $15.40 flat (set in Scoring rules). India: 5% GST on economy fares + Rs 536 of airport charges
// (Bengaluru user development fee Rs 300 from 1 Sep 2026 + aviation security fee Rs 236) at Rs 95.58 to the dollar (12 Oct 2026) = $5.61. Other countries: fares are left as shown.
const INDIA_TAX={pct:5,flat:5.61};
const taxRule=(P)=>{const o=(airports()[S.origin]||{}).country;return o==='India'?INDIA_TAX:o==='United States'?{pct:P.taxPct,flat:P.taxFlat}:null};
const netOf=(x,P)=>{if(!(+P.tax)||x==null)return x;const r=taxRule(P);return r?Math.max(1,(x-r.flat)/(1+r.pct/100)):x};
window.ask=msg=>new Promise(res=>{const d=document.createElement('div');d.className='modal';d.innerHTML='<div class="mbox"><p></p><div class="mrow"><button class="b alt" id="mn">Cancel</button><button class="b" id="my">Continue</button></div></div>';d.querySelector('p').textContent=msg;document.body.appendChild(d);const f=v=>{d.remove();res(v)};d.querySelector('#mn').onclick=()=>f(false);d.querySelector('#my').onclick=()=>f(true)});
const TABS=['Tool','Sheet','Scoring rules','Methodology','Statistics','Compare','Data'];
const CONTINENTS=['Asia','Europe','Africa','North America','South America','Oceania'];
const S={tab:'Tool',origin:'ATL',mode:'us',region:'Asia',excludeOwn:true,customList:'',dates:[],obs:[],params:{...DEFAULTS},sheetMode:'date',sheetDest:'',
  view:'real',expanded:null,sort:{k:'admi',d:-1},custom:[],dcText:'',sheetDate:'',dcTol:5,dcRes:null,running:false,stop:false,progress:null,access:'',apiState:'unknown',msg:''};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const clamp01=x=>Math.max(0,Math.min(1,x));
function airports(){const m={};for(const a of window.ADMI_AIRPORTS)m[a.iata]=a;for(const a of S.custom)m[a.iata]=a;return m}
function hav(a,b){const R=3958.8,p=Math.PI/180;const x=Math.sin((b.lat-a.lat)*p/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin((b.lon-a.lon)*p/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const iso=d=>d.toISOString().slice(0,10);
const todayD=()=>{const d=new Date();return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))};
const daysAhead=s=>Math.round((new Date(s+'T00:00:00Z')-todayD())/864e5);
const wk=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'});

/* ============================================================ scoring (locked formulas) */
function csVal(n,P){return n<=1?P.cs1:n===2?P.cs2:n===3?P.cs3:P.cs4}
function scoreRoute(dist,price,carriers,P,fpbOverride){
  if(dist<P.floor)return null;
  const fpb=fpbOverride==null?Math.max(dist*P.rate,+P.minFpb||0):fpbOverride;
  const pdsRaw=(price-fpb)/fpb,cs=csVal(carriers,P);
  let pds,rds;
  if(+P.smooth){ // smooth: above fair price 1-e^-x (never saturates); below fair price the discount counts as it is (down to -1)
    pds=pdsRaw>0?1-Math.exp(-pdsRaw):Math.max(-1,pdsRaw);
    const q=Math.max(0,pds)*(P.ref/Math.max(dist,P.floor));rds=1-Math.exp(-q)}
  else{pds=clamp01(pdsRaw);rds=clamp01(pds*(P.ref/Math.max(dist,P.floor)))}
  return{fpb,pdsRaw,pds,cs,rds,admi:P.wp*pds+P.wc*cs+P.wr*rds};
}
function ols(xs,ys){const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxx=0,sxy=0;for(let i=0;i<n;i++){sxx+=(xs[i]-mx)**2;sxy+=(xs[i]-mx)*(ys[i]-my)}const b=sxy/sxx;return{a:my-b*mx,b}}
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sd=a=>a.length<2?null:Math.sqrt(a.reduce((s,x)=>s+(x-mean(a))**2,0)/(a.length-1));

function viewObs(){return S.obs.filter(o=>o.origin===S.origin&&(S.view==='demo'?o.provider==='demo':o.provider!=='demo'))}
function distOf(o,AP){const a=AP[o.origin],b=AP[o.dest];return a&&b?hav(a,b):null}
function benchmark(rows,P){
  const pts=rows.filter(r=>r.carriers>=4&&r.dist>=P.floor);
  return pts.length>=8?{...ols(pts.map(r=>r.dist),pts.map(r=>r.price)),n:pts.length}:null;
}
function dateFactorsNow(){const P=S.params,AP=airports(),base=[];
  for(const o of viewObs()){if(o.status!=='ok'||o.price==null)continue;const dist=distOf(o,AP);if(dist==null||dist<P.floor)continue;base.push({date:o.date,carriers:o.carriers,price:netOf(o.price,P),dist})}
  const mid=a=>{const t=a.slice().sort((x,y)=>x-y),m=t.length>>1;return t.length%2?t[m]:(t[m-1]+t[m])/2};
  const dateF={};if(+P.std){const byD={};for(const r of base)if(r.carriers>=3)(byD[r.date]=byD[r.date]||[]).push(r.price/(r.dist*P.rate));
    for(const [d,v] of Object.entries(byD))if(v.length>=P.stdMin)dateF[d]={k:mid(v),n:v.length}}
  const kRef=Object.keys(dateF).length>=2?mid(Object.values(dateF).map(x=>x.k)):null;return{dateF,kRef}}
function analyse(){
  const AP=airports(),P=S.params,obs=viewObs();
  const base=[];
  for(const o of obs){
    if(o.status!=='ok'||o.price==null)continue;
    const dist=distOf(o,AP);if(dist==null||dist<P.floor)continue;
    base.push({...o,dist,shown:o.price,price:netOf(o.price,P)});
  }
  // date standardizer: k_d = median fare/FPB over competitive routes (3+ airlines) on date d; adjusted fare = fare * k_ref / k_d
  const mid=a=>{const t=a.slice().sort((x,y)=>x-y),m=t.length>>1;return t.length%2?t[m]:(t[m-1]+t[m])/2};
  const dateF={};
  if(+P.std){const byD={};for(const r of base)if(r.carriers>=3)(byD[r.date]=byD[r.date]||[]).push(r.price/(r.dist*P.rate));
    for(const [d,v] of Object.entries(byD))if(v.length>=P.stdMin)dateF[d]={k:mid(v),n:v.length}}
  const kRef=Object.keys(dateF).length>=2?mid(Object.values(dateF).map(x=>x.k)):null;
  const rows=[];
  for(const r of base){
    const f=kRef&&dateF[r.date]?kRef/dateF[r.date].k:1;
    const price=r.price*f,s=scoreRoute(r.dist,price,r.carriers,P);if(!s)continue;
    rows.push({...r,priceRaw:r.price,priceShown:r.shown,price,adj:f,...s});
  }
  const bm=benchmark(rows,P);
  if(bm)for(const r of rows){const s=scoreRoute(r.dist,r.price,r.carriers,P,Math.max(bm.a+bm.b*r.dist,1));r.admiB=s.admi}
  const by={};
  for(const r of rows)(by[r.dest]=by[r.dest]||[]).push(r);
  const routes=Object.entries(by).map(([dest,rs])=>{
    const v=rs.map(r=>r.admi),high=v.filter(x=>x>=P.thr).length/v.length;
    const label=v.length<P.minDates?'insufficient dates':high>=P.share?'structural':'not consistently high';
    return{dest,info:AP[dest],dist:rs[0].dist,n:v.length,admi:mean(v),sd:sd(v),high,label,carriers:mean(rs.map(r=>r.carriers)),
      price:mean(rs.map(r=>r.price)),admiB:bm?mean(rs.map(r=>r.admiB)):null,rs:rs.sort((a,b)=>a.date<b.date?-1:1)};
  });
  const noDirect=[...new Set(obs.filter(o=>o.status==='no_direct').map(o=>o.dest))];
  const errors=obs.filter(o=>o.status!=='ok'&&o.status!=='no_direct').length;
  return{rows,routes,bm,noDirect,errors,total:obs.length,dateF,kRef};
}

/* ============================================================ destinations + dates */
function divisionsFor(country){return (window.ADMI_DIVISIONS||{})[country]||null}
function destinations(){
  const AP=airports(),o=AP[S.origin];let list=[];
  if(S.mode==='list'){list=S.customList.split(/[\s,;]+/).map(x=>x.trim().toUpperCase()).filter(Boolean).map(c=>AP[c]||{iata:c,unknown:true})}
  else if(S.mode==='us')list=window.ADMI_AIRPORTS.filter(a=>a.usState);
  else if(S.mode==='within'){const dv=o&&divisionsFor(o.country);if(dv)list=dv.map(([n,c])=>AP[c]?{...AP[c],sub:n}:null).filter(Boolean)}
  else if(S.mode==='world')list=window.ADMI_AIRPORTS.filter(a=>a.primary);
  else list=window.ADMI_AIRPORTS.filter(a=>a.primary&&a.region===S.region);
  list=list.filter(a=>a.iata!==S.origin);
  if(S.excludeOwn&&o&&(S.mode==='world'||S.mode==='region'))list=list.filter(a=>a.country!==o.country);
  return[...new Map(list.map(a=>[a.iata,a])).values()];
}
function thanksgiving(y){const d=new Date(Date.UTC(y,10,1));const off=(4-d.getUTCDay()+7)%7;return new Date(Date.UTC(y,10,1+off+21))}
function suggestDates(fresh){
  // Lead times are spread across the advance-purchase windows airlines actually price in. Fares step at fences
  // near 7, 14 and 21 days before departure, so two dates inside one window largely re-measure the same pricing
  // state and waste an observation. Targets are spaced wider as they get further out, because fares move
  // proportionally less the earlier you look. Weekdays are varied and deliberately not in step with lead time,
  // so a day-of-week effect cannot be mistaken for a lead-time effect.
  const t=todayD(),day=864e5,want=Math.max(1,+S.params.minDates||5),out=fresh?[]:[...S.dates];
  const LEAD=[7,17,28,45,70,100,140];        // days before departure
  const DOW =[3,6,2,5,4,1,0];                // Wed, Sat, Tue, Fri, Thu, Mon, Sun
  // High-demand windows are skipped: fares there are driven by the holiday, not by the route's own structure.
  // US-centric (Thanksgiving, Christmas to New Year, Independence Day). Indian festival dates move each year and
  // are not covered, so check them by hand when the origin is in India.
  const inBlackout=d=>{const m=d.getUTCMonth()+1,dd=d.getUTCDate();
    return (m===11&&dd>=20)||(m===12&&dd>=18)||(m===12&&dd<=2)||(m===1&&dd<=5)||(m===7&&dd<=7)};
  const pool=[];
  for(let i=0;i<LEAD.length;i++){
    let d=new Date(t.getTime()+LEAD[i]*day),k=0;
    while(d.getUTCDay()!==DOW[i]&&k<7){d=new Date(d.getTime()+day);k++}
    let shift=0;while(inBlackout(d)&&shift<5){d=new Date(d.getTime()+7*day);shift++}  // keep the weekday, move a week
    const s=iso(d);if(!pool.includes(s))pool.push(s);
  }
  for(const d of pool){if(out.length>=want)break;if(!out.includes(d))out.push(d)}
  return out.sort();
}

let metaT=null;
function queueMeta(){if(!XDB)return;clearTimeout(metaT);metaT=setTimeout(()=>{chain=chain.then(async()=>{try{await XDB.doc('meta/state').set({params:S.params,dates:S.dates,origin:S.origin,custom:S.custom,mode:S.mode,updatedAt:new Date().toISOString()});syncErr=''}catch(e){syncErr=(e&&e.code)||'error'}syncStatus()})},900)}
function seedFromBundle(){try{const B=window.ADMI_SEED;if(!B)return;const have=new Map(S.obs.map(o=>[o.key,o]));const added=[];for(const d of B.docs)for(const r of (d.rows||[])){if(!have.has(r.key)){have.set(r.key,r);added.push(r)}}if(added.length){S.obs=[...have.values()];putObsLocal(added)}S.dates=[...new Set([...(S.dates||[]),...B.dates])].sort()}catch(e){}}
async function loadShared(){

    const db=await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),4000))]);if(!db)return;XDB=db;
    const snap=await db.collection('obs').get();const have=new Map(S.obs.map(o=>[o.key,o]));let added=[];
    snap.docs.forEach(d=>{const x=d.data()||{};for(const r of (x.rows||[])){const cur=have.get(r.key);if(!cur||(r.fetchedAt||'')>(cur.fetchedAt||'')){have.set(r.key,r);added.push(r)}}});
    if(added.length){S.obs=[...have.values()];if(DB){const t=DB.transaction('obs','readwrite'),st=t.objectStore('obs');added.forEach(o=>st.put(o))}}

/* ============================================================ fetching */
function demoResult(origin,dest,date,dist){
  let h=0;for(const c of origin+dest+date)h=(h*31+c.charCodeAt(0))>>>0;const r=()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296};
  const k=[1,1,2,3,4][Math.floor(r()*5)],names=['Delta','American','United','Southwest','Frontier'].slice(0,k);
  if(r()<.12)return{status:'no_direct',price:null,airlines:[]};
  return{status:'ok',price:Math.round(dist*(0.12+r()*0.6)+40+r()*80),airlines:names};
}
async function fetchOne(origin,dest,date,demo,dist){
  if(demo)return demoResult(origin,dest,date,dist);
  let res;try{res=await fetch(`/api/search?origin=${origin}&dest=${dest}&date=${date}`,{headers:S.access?{'x-access-code':S.access}:{}})}catch(e){throw new Error('not found: live fetching only works on your deployed site (with the api folder), not from a file on your computer. Use demo data to try the tool.')}
  if(res.status===401)throw new Error('unauthorized: check the access code');
  if(res.status===503)throw new Error('server has no SERPAPI_KEY set');
  if(res.status===404)throw new Error('/api/search not found: deploy the api folder (see README)');
  return await res.json();
}
async function runFetch(demo){
  const AP=airports(),o=AP[S.origin];if(!o){S.msg='Origin not in the airport table: add it under Data → Add airport.';return render()}
  const dests=destinations().filter(d=>!d.unknown),prov=demo?'demo':'live';
  const have=new Set(S.obs.map(x=>x.key));
  const jobs=[];for(const d of dests)for(const dt of S.dates){const key=[S.origin,d.iata,dt,prov].join('|');if(!have.has(key))jobs.push({d,dt,key})}
  if(!jobs.length){S.msg='Everything selected is already stored. Nothing to fetch.';return render()}
  if(!demo&&!(await ask(`${jobs.length} new searches will be sent to your fare service (cached ones are skipped). Continue?`)))return;
  S.running=true;S.stop=false;S.msg='';S.progress={done:0,total:jobs.length,err:0};render();
  let idx=0;
  const worker=async()=>{while(idx<jobs.length&&!S.stop){const j=jobs[idx++];
    try{const dist=hav(o,j.d);const r=await fetchOne(S.origin,j.d.iata,j.dt,demo,dist);
      const rec={key:j.key,origin:S.origin,dest:j.d.iata,date:j.dt,fetchedAt:new Date().toISOString(),daysAhead:daysAhead(j.dt),price:r.price,carriers:(r.airlines||[]).length,airlines:(r.airlines||[]).join(', '),status:r.status,provider:prov};
      if(r.status==='ok'||r.status==='no_direct'){S.obs.push(rec);await putObs([rec])}else S.progress.err++;
    }catch(e){S.progress.err++;S.msg=e.message;if(/unauthorized|SERPAPI|not found/.test(e.message)){S.stop=true}}
    S.progress.done++;if(S.progress.done%4===0)render();
    if(!demo)await new Promise(r=>setTimeout(r,250));}};
  await Promise.all([worker(),worker(),worker()]);
  S.running=false;S.view=demo?'demo':'real';render();
}

  const F=S._af||(S._af=dateFactorsNow()),f=F.kRef&&F.dateF[rec.date]?F.kRef/F.dateF[rec.date].k:1;

  <div class="panel"><h2>3 · Dates</h2><p class="sub">Use 5 or more departure dates (the ATL study uses 5). Every date is searched on the same day, so each one carries a different lead time.</p>

    ${S.dates.length&&S.dates.length<S.params.minDates?`<div class="note">Fewer than ${S.params.minDates} dates: routes will be labelled "insufficient dates".</div>`:''}
    <div class="note">Fares depend on how far ahead you search. Every date here is searched today, so each has a different lead time. Read the standard deviation with that in mind.</div></div>

function resultsHTML(A){
  if(!A.routes.length)return'<p class="sub">No scored routes yet for this origin. Routes under the distance floor, with no nonstop flight, or with errors are not scored.</p>';
  const P=S.params,k=S.sort.k,d=S.sort.d;
  const dfs=Object.entries(A.dateF||{}).sort();
  const dfNote=A.kRef&&dfs.length?`<div class="note"><b style="color:var(--text)">Date standardizer on.</b> Typical competitive-route fare ÷ FPB per date, then fares rescaled to the middle value (${A.kRef.toFixed(2)}): ${dfs.map(([d,v])=>`${d} ${v.k.toFixed(2)}× (adj ${(A.kRef/v.k).toFixed(2)})`).join(' · ')}. Dates with fewer than ${S.params.stdMin} competitive routes are left unadjusted.</div>`:'';
  const unvN=A.rows.filter(r=>r.copied).length;
  const unvNote=unvN?`<div class="note warn">${unvN} fare(s) use airline counts that were copied from another date and never confirmed. Confirm them on the Sheet tab (✓ confirm) before trusting these scores.</div>`:'';
  const rs=A.routes.slice().sort((a,b)=>((a[k]??-1)-(b[k]??-1))*d||0);
  const kp=`<div class="grid" style="margin:10px 0 14px"><div class="kpi"><b>${A.routes.length}</b><span>routes scored</span></div>
   <div class="kpi"><b>${A.routes.filter(r=>r.label==='structural').length}</b><span>labelled structural</span></div>
   <div class="kpi"><b>${(100*A.rows.filter(r=>r.carriers===1).length/A.rows.length).toFixed(0)}%</b><span>of priced route-dates with 1 carrier</span></div>
   <div class="kpi"><b>${A.noDirect.length}</b><span>destinations with no nonstop</span></div></div>
   ${A.bm?`<div class="note">Benchmark baseline fitted on ${A.bm.n} price points with 4+ carriers: <code>FPB-b = ${A.bm.a.toFixed(1)} + ${A.bm.b.toFixed(3)} × miles</code>. ADMI-b uses it in place of $${P.rate}/mile.</div>`:'<div class="note">Benchmark baseline needs at least 8 price points on routes with 4+ carriers.</div>'}`;
  const th=(key,l)=>`<th onclick="sortBy('${key}')">${l}${k===key?(d>0?' ▲':' ▼'):''}</th>`;
  return dfNote+unvNote+kp+`<div style="overflow-x:auto"><table><tr>${th('dest','To')}${th('dist','Miles')}${th('n','Dates')}${th('price','Mean fare')}${th('carriers','Carriers')}${th('admi','Mean ADMI')}${th('admiB','ADMI-b')}${th('sd','SD')}${th('high','% dates ≥ '+P.thr)}<th>Label</th></tr>
  ${rs.map(r=>{const lc=r.label==='structural'?'s':r.label==='insufficient dates'?'i':'n';
   const open=S.expanded===r.dest;
   return`<tr class="r" onclick="S.expanded=${open?'null':`'${r.dest}'`};render()"><td><b>${r.dest}</b> <span style="color:var(--dim)">${esc(r.info?r.info.city:'')}${r.info&&r.info.sub?', '+esc(r.info.sub):r.info?', '+esc(r.info.country):''}</span></td><td>${Math.round(r.dist)}</td><td>${r.n}</td><td>$${r.price.toFixed(0)}</td><td>${r.carriers.toFixed(1)}</td><td>${r.admi.toFixed(3)}</td><td>${r.admiB==null?'':r.admiB.toFixed(3)}</td><td>${r.sd==null?'':r.sd.toFixed(3)}</td><td>${(100*r.high).toFixed(0)}%</td><td><span class="tag ${lc}">${r.label}</span></td></tr>
   ${open?`<tr><td colspan="10" style="background:var(--soft)"><table><tr><th>Date</th><th>Days ahead</th><th>Fare</th><th>Carriers</th><th>Airlines</th><th>FPB</th><th>PDS raw</th><th>PDS</th><th>CS</th><th>RDS</th><th>ADMI</th></tr>${r.rs.map(x=>`<tr><td>${x.date} ${wk(x.date)}</td><td>${x.daysAhead}</td><td>$${x.priceRaw}${x.adj&&Math.abs(x.adj-1)>0.005?` <span style="color:var(--dim)">(adj $${x.price.toFixed(0)})</span>`:''}</td><td>${x.carriers}</td><td>${esc(x.airlines)}</td><td>$${x.fpb.toFixed(0)}</td><td>${x.pdsRaw.toFixed(2)}</td><td>${x.pds.toFixed(2)}</td><td>${x.cs}</td><td>${x.rds.toFixed(2)}</td><td>${x.admi.toFixed(3)}</td></tr>`).join('')}</table></td></tr>`:''}`}).join('')}</table></div>

window.sortBy=k=>{S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:-1};render()};
window.setOrigin=v=>{S.origin=v.toUpperCase().trim();saveMeta();clearTimeout(window._ot);window._ot=setTimeout(render,350)};
window.addDate=()=>{const v=$('newdate').value;if(v&&!S.dates.includes(v)){S.dates.push(v);S.dates.sort();saveMeta();render()}};
window.freshDates=async()=>{
  const want=suggestDates(true);
  const keepWithData=S.dates.filter(d=>viewObs().some(o=>o.date===d));
  const drop=S.dates.filter(d=>!want.includes(d));
  const dropWithData=drop.filter(d=>keepWithData.includes(d));
  if(dropWithData.length){
    const n=viewObs().filter(o=>dropWithData.includes(o.date)).length;
    if(!(await ask(`${dropWithData.length} of your current dates hold ${n} saved fares (${dropWithData.join(', ')}). Replacing the dates DELETES those fares. Continue?`)))return;
    const keys=new Set(viewObs().filter(o=>dropWithData.includes(o.date)).map(o=>o.key));
    S.obs=S.obs.filter(o=>!keys.has(o.key));
    if(DB)for(const k of keys)tx('obs','readwrite').delete(k);
    for(const d of dropWithData)queueSync(S.origin,d,'manual');
  }
  S.dates=want;S._af=null;saveMeta();
  S.msg='Dates replaced with a fresh spread: '+want.map(d=>d+' ('+daysAhead(d)+'d)').join(', ')+'.';
  render()};
window.rmDate=async d=>{
  const rows=viewObs().filter(o=>o.date===d);
  if(rows.length){if(!(await ask(`${d} has ${rows.length} saved fares. Removing the date DELETES them. Continue?`)))return;
    const provs=[...new Set(rows.map(o=>o.provider))],keys=new Set(rows.map(o=>o.key));
    S.obs=S.obs.filter(o=>!keys.has(o.key));
    if(DB){try{const t=DB.transaction('obs','readwrite'),st=t.objectStore('obs');keys.forEach(k=>st.delete(k))}catch(e){}}
    provs.forEach(p=>queueSync(S.origin,d,p))}
  S.dates=S.dates.filter(x=>x!==d);saveMeta();render()};
window.clearDates=()=>{const keep=S.dates.filter(d=>viewObs().some(o=>o.date===d));
  S.dates=keep;saveMeta();S.msg=keep.length?`Dates that have saved fares stay (${keep.join(', ')}). Remove them one by one with the x if you really want their fares deleted.`:'';render()};

function viewRules(){
  const P=S.params,f=(k,l,step)=>`<div><label>${l}</label><input type="number" step="${step||0.01}" value="${P[k]}" onchange="setP('${k}',this.value)"></div>`;
  const exAP=airports(),exA=exAP[(S.exf||S.origin||'').toUpperCase()],exB=exAP[(S.ext||'').toUpperCase()];
  const exAuto=exA&&exB?Math.round(hav(exA,exB)):null,exDist=S.exMan&&$('exd')?+$('exd').value:(exAuto!=null?exAuto:+($('exd')?.value||300));
  const ex=scoreRoute(exDist,+($('exp')?.value||250),+($('exc')?.value||1),P);
  return`<div class="panel"><h2>Scoring rules</h2><div class="note"><b>Model locked on Oct 11, 2026.</b> Final settings: taxes removed, $75 fixed-cost floor, smooth scoring, date standardizer off, 5 dates, threshold 0.6 on 80% of dates. Changing a value below changes every published number, so only do it to run a labelled comparison.</div><p class="sub">Setting Smooth scoring to 0 reproduces the original methodology's verification table exactly. Change a value and every result recalculates; reset restores the defaults.</p>
  <h3 style="font-size:16px;margin-top:14px">Fair price baseline</h3><p class="sub">$0.15 a mile is the low end of the $0.15 to $0.20 range reported for US airline revenue per passenger-mile. Use the Statistics tab's stress test to see $0.175 and $0.20.</p><div class="row">${f('rate','Dollars per mile',0.01)}${f('floor','Distance floor (miles)',1)}${f('ref','RDS reference (miles)',1)}</div>
  <h3 style="font-size:16px;margin-top:14px">Fixed cost floor</h3><div class="row">${f('minFpb','Minimum fair price per nonstop ($, 0 = off)',1)}</div><p class="sub">A flight has costs that do not shrink with distance, so a 134-mile hop cannot be fairly priced at 134 × $0.15 = $20. The fair price is the larger of miles × rate and this floor. It only matters for routes shorter than floor ÷ rate (500 miles at $75). $75 is an assumption, not a measured number; set 0 to remove it.</p>
  <h3 style="font-size:16px;margin-top:14px">Concentration score by carriers on the route</h3><div class="row">${f('cs1','1 carrier')}${f('cs2','2 carriers')}${f('cs3','3 carriers')}${f('cs4','4+ carriers')}</div>
  <h3 style="font-size:16px;margin-top:14px">Score shape</h3><div class="row">${f('smooth','Smooth scoring (1 = on, 0 = original hard 0 to 1 cut-offs)',1)}</div><p class="sub">Original: PDS is cut off at 0 and 1, so every cheap route scores the same low number and every very expensive route scores exactly 1.000. Smooth: PDS = 1 − e^(−x) above the fair price (x = (fare − FPB) ÷ FPB), so a fare 2× fair scores 0.63, 3× scores 0.86 and it never quite hits 1. Below the fair price the discount counts as it is (a fare at half of FPB gives PDS −0.5), so cheap competitive routes get different, possibly negative, scores. RDS uses the same smooth curve. A negative ADMI means the fare sits below what distance justifies.</p>
  <h3 style="font-size:16px;margin-top:14px">Combination weights</h3><div class="row">${f('wp','PDS weight')}${f('wc','CS weight')}${f('wr','RDS weight')}</div>
  ${Math.abs(P.wp+P.wc+P.wr-1)>1e-9?'<div class="note warn">Weights do not sum to 1.</div>':''}
  <h3 style="font-size:16px;margin-top:14px">Taxes and fees</h3><div class="row">${f('tax','Remove taxes from fares (1 = on, 0 = off)',1)}${f('taxPct','Excise tax %',0.1)}${f('taxFlat','Flat fees per ticket ($)',0.1)}</div><p class="sub">Both sites show the total with taxes. Taxes do not reflect pricing power, so by default the score uses the fare before them: (shown fare − $15.40) ÷ 1.075. That is the 7.5% federal excise tax, plus a flat $15.40 made of the $5.30 segment tax, the $5.60 security fee and a $4.50 airport charge (PFC, the maximum, which Atlanta charges). Other US origins may charge less than $4.50, so lower the flat amount for them. The numbers above apply to flights leaving the United States. For flights leaving India the tool uses 5% GST (economy fares) plus a flat $5.61: Rs 300 Bengaluru user development fee (from 1 Sep 2026) and Rs 236 aviation security fee, at Rs 95.58 to the dollar on 12 Oct 2026. The fuel surcharge is part of the airline's own fare and is not removed. Any other country: fares are used as shown.</p>
  <h3 style="font-size:16px;margin-top:14px">Date standardizer</h3><div class="row">${f('std','Standardize fares across dates (1 = on, 0 = off)',1)}${f('stdMin','Competitive routes needed per date',1)}</div><p class="sub">Every date is searched today, so each has a different lead time and day of week. That moves all fares together. The standardizer rescales each date so the typical competitive route costs the same on every date. See the Methodology tab.</p>
  <h3 style="font-size:16px;margin-top:14px">Consistency rule (multi-date)</h3><div class="row">${f('thr','ADMI threshold')}${f('share','Share of dates required')}${f('minDates','Minimum dates',1)}</div>
  <div class="row" style="margin-top:14px"><button class="b alt" onclick="S.params={...DEFAULTS};saveMeta();render()">Reset to locked defaults</button></div></div>

  ${ex?`<div class="grid" style="margin-top:12px"><div class="kpi"><b>$${ex.fpb.toFixed(0)}</b><span>FPB</span></div><div class="kpi"><b>${ex.pds.toFixed(3)}</b><span>PDS (raw ${ex.pdsRaw.toFixed(2)})</span></div><div class="kpi"><b>${ex.cs}</b><span>CS</span></div><div class="kpi"><b>${ex.rds.toFixed(3)}</b><span>RDS</span></div><div class="kpi"><b>${ex.admi.toFixed(3)}</b><span>ADMI</span></div></div>`:'<div class="note">Under the distance floor: excluded from scoring.</div>'}
  <p class="sub" style="margin-top:10px">Check: 300 mi, $250, 1 carrier gives 1.000. 2000 mi, $350, 3 carriers gives 0.191.</p></div>`;
}

function viewMethod(){return`<div class="panel method">
<h2>Methodology</h2>
<div class="note">The idea, the question and the data are the author's own. The component formulas (PDS, CS, RDS, and how they combine) were derived collaboratively with Claude and are stated that way wherever the project is described.</div>
<h3>What ADMI measures</h3><p>For a nonstop route, how far the fare rises above what distance alone would justify, weighted by how few carriers compete on the route. A route priced at its distance baseline with many carriers scores near 0. A short route with one carrier and a steep fare scores near 1.</p>
<h3>Scope: read before citing any finding</h3><ul><li>The existing dataset departs only from Atlanta (ATL), Delta's largest hub. State findings as "49% of direct routes from Atlanta are monopoly-priced", never as a statement about U.S. air travel.</li><li>The constants (<code>$0.15/mile</code>, the CS tiers, 500 and 100 miles) were set for U.S. domestic fares in dollars. Running other origins or international routes is exploratory: the tool computes the numbers, but the baseline has not been validated there.</li><li>Many airport pairs have no nonstop flight. Those are recorded as "no nonstop" and not scored.</li></ul>
<h3>0 · Inclusion floor</h3><p>Routes under 100 miles are excluded: below that, flying competes with driving, a different decision. The 100-mile figure follows the proximity literature (Bouba-Olga &amp; Ferru, 2012; Laursen et al., 2011).</p>
<h3>1 · Fair Price Baseline (FPB)</h3><div class="formula">FPB = distance × $0.15</div><p>What the route would cost if priced on distance alone. The $0.15 is a stated assumption, not a law of nature. Weakness: fixed costs per flight make short routes cost more per mile, so a flat rate makes short routes look overpriced. For this reason a <b>benchmark baseline</b> is also computed: a line fitted through fares on routes with 4+ carriers, <code>FPB-b = a + b × distance</code>. Report both.</p>
<h3>2 · Price Distortion Score (PDS)</h3><div class="formula">PDS = clamp₀₁( (Fare − FPB) / FPB )</div><p>Underpriced routes score 0. The clamp means 2× the baseline and 5× look the same, so the tool shows the unclamped value too.</p>
<h3>3 · Concentration Score (CS)</h3><div class="formula">1 carrier = 1.0 · 2 = 0.66 · 3 = 0.33 · 4+ = 0.1</div><p>Chosen over a continuous index for interpretability. The values are design choices; the Herfindahl-Hirschman Index is the standard formal analogue. A sensitivity check with other tier values is recommended.</p>
<h3>4 · Route Distortion Score (RDS)</h3><div class="formula">RDS = clamp₀₁( PDS × 500 / max(distance, 100) )</div><p>Amplifies price distortion on short routes. This makes short routes score higher by construction, so the verification table shows the formula behaves as designed, not independent confirmation. The independent evidence is the raw per-mile fare comparison.</p>
<h3>5 · Combining</h3><div class="formula">ADMI = 0.5 × PDS + 0.3 × CS + 0.2 × RDS</div><p>Weights are design choices, never optimised on data. PDS appears twice (directly and inside RDS), so on short routes its effective weight is above 0.5.</p>
<h3>6a · Choosing the dates</h3><p>Dates are chosen once, before looking at any multi-date result, and not changed afterwards. They are ordinary single-day one-way searches, never picked because a fare looked interesting.</p>
<p><b>Why the dates are spread, and by how much.</b> Airlines do not price continuously with lead time. Revenue management sells from fare buckets behind advance-purchase fences, and the common ones sit near 21, 14 and 7 days before departure, with fares stepping up as each is crossed. Two dates inside the same window therefore measure nearly the same pricing state, and the second one adds little. The suggested set targets lead times of roughly <b>7, 17, 28, 45 and 70 days</b>, which places one date in each of the windows that matter and leaves gaps of ten days or more between neighbours. Targets widen as they go out because fares move proportionally less the earlier you look, so equal spacing would waste observations at the far end.</p>
<p><b>Weekday is varied on purpose, and not in step with lead time.</b> Departure weekday moves fares independently of lead time: midweek departures are typically cheaper than Friday and Sunday ones. With only five dates you cannot balance both factors, so lead time is treated as the primary axis and each date is given a different weekday, assigned so that weekday does not trend with lead time. If the short-lead dates were all Fridays, a weekday effect and a lead-time effect would be impossible to tell apart.</p>
<p><b>High-demand windows are skipped.</b> Fares around Thanksgiving, Christmas to New Year, and Independence Day are driven by the holiday rather than by the route's own structure, so a candidate landing in one is pushed forward a week, keeping its weekday. Indian festival dates move each year and are not covered by this rule, so they have to be checked by hand when the origin is in India. A holiday date can still be added deliberately, but it should be reported separately rather than mixed into the main set.</p>
<p><b>What this does not fix.</b> Every fare is still searched on one day, so the whole set shares one market snapshot. Spreading departure dates separates lead-time effects from route effects; it does not protect against something that moved prices everywhere on the day of collection.</p>
<h3>6e · Fixed cost floor</h3><p>FPB = max(miles × $0.15, $75). Without it a 134-mile route has a fair price of $20, so any real fare scores as extreme distortion and every short monopoly route piles up near 1.0. The $75 floor is an assumption (roughly what a nonstop flight costs to operate before distance matters), not an estimate from the data; a line fitted to the ATL routes with 3+ airlines gave about $12 + $0.087 per mile, but there are too few short competitive routes to pin the fixed part down. Report results with the floor on and off.</p>
<h3>6d · Smooth scoring</h3><p>The original PDS cut-offs (0 and 1) made scores pile up: every fare at or below the fair price scored the same, and every fare above twice the fair price scored exactly 1.000. Smooth scoring replaces the cut-offs with PDS = 1 − e<sup>−x</sup> above the fair price and PDS = x (down to −1) below it, with x = (fare − FPB) ÷ FPB. RDS = 1 − e<sup>−q</sup>, with q = max(0, PDS) × 500 ÷ distance. Weights, CS tiers and the 0.6 threshold are unchanged. ADMI can now be negative, meaning the fare is below what distance justifies. State in the post which mode the published numbers use.</p>
<h3>6c · Ties on the lowest fare</h3><p>When two airlines show the same lowest nonstop fare, the airline with the shorter travel time is recorded as the cheapest. The tie rule changes only which airline is named; the fare and the airline count, which are all the score uses, are unchanged.</p>
<h3>6b · The date standardizer</h3><p>Every fare is searched on the same day, so each departure date has a different lead time, and fares rise or fall with it on every route at once. That common movement is not route-specific distortion, so it should not decide a route's score. For each date d, take the competitive routes (3 or more airlines) and compute their median of fare ÷ FPB. Call it k<sub>d</sub>. Let k<sub>ref</sub> be the median of k<sub>d</sub> across all dates. Each fare is then multiplied by k<sub>ref</sub> ÷ k<sub>d</sub> before scoring, so the typical competitive route costs the same on every date. Both the raw and the adjusted fare are kept in the detail export.</p><p><b>Assumptions and limits.</b> It assumes lead-time and day-of-week effects move competitive and monopoly routes by about the same proportion, which is not guaranteed: monopoly routes may be more sensitive to lead time. It needs at least 5 competitive routes on a date, otherwise that date is left unadjusted. It removes date-level swings only, not differences between routes. It uses the same competitive routes the benchmark uses, so the two checks are not independent. The label rule uses adjusted fares; raw ADMI is shown next to it.</p>
<h3>6 · Multi-date consistency</h3><p>One day's fares can be noise. Each route is scored on at least 5 departure dates and labelled <b>structural</b> only if its ADMI is at or above 0.6 on at least 80% of dates. The rule is fixed before running. Because each search happens today, lead time varies across dates, which also moves fares.</p>
<h3>Limitations</h3><ul><li>Cheapest fare per date, one-way, nonstop only.</li><li>Carrier counts come from the search results; codeshares can add a carrier.</li><li>Chosen weights, reference distances and baseline rate were not tested against alternatives.</li><li>No causal claim is made.</li></ul></div>`}

window.wipe=async()=>{if(!(await ask('Delete every stored price in this browser?')))return;S.obs=[];if(DB)tx('obs','readwrite').clear();render()};
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
window.exportCSV=kind=>{const A=analyse(),q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;let rows;
  if(kind==='summary')rows=[['origin','dest','miles','dates','mean_fare','mean_carriers','mean_admi','mean_admi_b','sd','share_dates_high','label']].concat(A.routes.map(r=>[S.origin,r.dest,r.dist.toFixed(0),r.n,r.price.toFixed(2),r.carriers.toFixed(2),r.admi.toFixed(4),r.admiB==null?'':r.admiB.toFixed(4),r.sd==null?'':r.sd.toFixed(4),r.high.toFixed(2),r.label]));
  else rows=[['origin','dest','date','days_ahead','miles','fare_shown','fare_net','fare_adjusted','carriers','airlines','fpb','pds_raw','pds','cs','rds','admi','provider']].concat(A.rows.map(r=>[r.origin,r.dest,r.date,r.daysAhead,r.dist.toFixed(0),r.priceShown,r.priceRaw.toFixed(2),r.price.toFixed(2),r.carriers,r.airlines,r.fpb.toFixed(2),r.pdsRaw.toFixed(3),r.pds.toFixed(3),r.cs,r.rds.toFixed(3),r.admi.toFixed(4),r.provider]));
  dl(`admi-${kind}-${S.origin}${S.view==='demo'?'-DEMO':''}.csv`,rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')};


const ALIAS={FDS:'FSD'};
window.loadDC=f=>{if(!f)return;const r=new FileReader();r.onload=()=>{S.dcText=r.result;render()};r.readAsText(f)};
window.checkDist=()=>{
  const AP=airports(),o=AP[S.origin],out=[];
  for(const line of S.dcText.split(/\r?\n/)){
    const m=line.match(/\b[A-Z]{3}\b/);if(!m)continue;let code=m[0];
    const rest=line.slice(m.index+3);
    let d=(line.match(/(\d[\d,]*\.?\d*)\s*mi(les)?\b/i)||[])[1];
    if(!d){const nums=rest.match(/\d[\d,]*\.?\d*/g);d=nums&&nums[nums.length-1]}
    const fixed=ALIAS[code],a=AP[code]||AP[fixed];
    if(!d){if(a&&o&&a.iata!==o.iata)out.push({code:a.iata,asTyped:code,yours:null,calc:hav(o,a),diff:0,flag:false,auto:true});continue}
    d=parseFloat(d.replace(/,/g,''));
    if(!a||!o){out.push({code,yours:d,unknown:true,hint:fixed&&!AP[code]?fixed:null});continue}
    const c=hav(o,a),diff=100*(d-c)/c;
    out.push({code:a.iata,asTyped:code,yours:d,calc:c,diff,flag:Math.abs(diff)>S.dcTol});
  }
  S.dcRes=out;render();
};
function dcHTML(){const r=S.dcRes;if(!r.length)return'<div class="note warn">No known airport codes were found.</div>';
  const bad=r.filter(x=>x.flag||x.unknown);
  return`<div class="note ${bad.length?'warn':''}">${r.length} routes checked: ${bad.length?bad.length+' need attention':'all within '+S.dcTol+'%'}.</div>
  <div style="overflow-x:auto"><table><tr><th>Code</th><th>Your miles</th><th>Computed</th><th>Difference</th><th></th></tr>
  ${r.slice().sort((a,b)=>(b.flag?1:0)-(a.flag?1:0)).map(x=>x.unknown?`<tr><td>${esc(x.code)}</td><td>${x.yours}</td><td colspan="2">code not in airport table${x.hint?' (did you mean '+x.hint+'?)':''}</td><td><span class="tag i">check</span></td></tr>`
   :`<tr><td>${x.code}${x.asTyped&&x.asTyped!==x.code?' <span style="color:var(--dim)">(typed '+esc(x.asTyped)+')</span>':''}</td><td>${x.auto?'<span style="color:var(--dim)">not given</span>':x.yours}</td><td>${x.calc.toFixed(0)}</td><td>${x.auto?'':(x.diff>0?'+':'')+x.diff.toFixed(1)+'%'}</td><td>${x.auto?'<span class="tag n">auto</span>':x.flag?'<span class="tag s">check</span>':'<span class="tag n">ok</span>'}</td></tr>`).join('')}</table></div>
  <p class="sub" style="margin-top:8px">Great-circle distance is the straight line between airports. Flown or road distance can run a few percent higher, so use a tolerance of 3 to 5%.</p>`}

loadAll().catch(()=>{}).then(render).then(()=>loadShared()).catch(()=>{}).then(render);
</script>
